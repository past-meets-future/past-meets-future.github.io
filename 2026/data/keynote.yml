title: "Trust in the Loop: How Libraries, Archives, and Museums Can Balance Institutional Expertise and AI-Assisted Discovery"
abstract: "Libraries, archives, and museums are widely trusted as stewards of authoritative records. At the same time, the data underlying these collections is heterogeneous, shaped by different institutional practices, and often tied closely to the historical and scientific contexts in which it was created. As institutions begin to apply AI methods to support discovery and interpretation, a central challenge emerges: how do we maintain trust in authoritative records while inviting users into the uncertainty and iteration of AI-driven processes?

This presentation draws on lessons learned from AI pilot projects across the Smithsonian's science and history museums and research centers, with a special focus on the recent Revolution Crossroads project. Revolution Crossroads is a multi-institutional, public-facing initiative bringing together collections data from several large, national-level cultural heritage organizations. Working across datasets from the American Revolutionary War era (1770–1810) that differ in format, structure, standards, and historical context, the project is using AI to explore connections at scale.

Across these pilots, unsupervised AI methods have sat comfortably alongside institutional expertise because they organize rather than assert. I will share examples of how multimodal embedding models have assisted in collections discovery, evaluation, and even accessible alt-text image description. Throughout, the goal is not to replace curatorial judgment but to make it more visible — revealing where models are confident, where they are guessing, and where expert intervention matters most. Trust, in this framing, comes not from hiding uncertainty but from designing systems that keep experts and users in the loop."

bio: "Mike Trizna is a data scientist in the Smithsonian Institution Office of the Chief Data and AI Officer, which is situated within the central Office of Digital and Innovation. Previous to joining the Office of Digital and Innovation, Mike worked for 12 years at the Smithsonian National Museum of Natural History as a bioinformatician.

In his current role, he collaborates with researchers and collections staff across the many units of the Smithsonian to pilot responsible applications of AI to their current work. He is also focused on capacity-building data science skills for Smithsonian staff, fellows, and interns.

Mike leads the Smithsonian Carpentries data upskilling team, co-manages the Smithsonian AI Interest Group, and is heavily involved in the operation of the global organization AI4LAM (AI for Libraries, Archives, and Museums)."
